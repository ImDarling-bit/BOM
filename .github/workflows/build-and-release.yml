name: Manifestation Toolkit — Build & Release

# Déclenché par les tags `v*` (ex. v1.0.0).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # URLs des serveurs privés : Settings → Secrets and variables → Actions → Variables
  EXPO_PUBLIC_WS_URL: ${{ vars.EXPO_PUBLIC_WS_URL }}
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  # Optionnel : style de carte auto-hébergé (sinon OpenFreeMap, gratuit et sans clé).
  EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.EXPO_PUBLIC_MAP_STYLE_URL }}
  APP_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: Android (app-release.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || V="1.0.0"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Lint & typecheck
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --no-install

      # Clé de signature optionnelle. Sans ces secrets, l'APK est signé avec la
      # clé de debug du template : installable, mais les mises à jour futures
      # exigeront de garder la même clé → configure-les avant la 1re vraie release.
      - name: Keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent : APK signé avec la clé de debug."
          fi

      - name: Gradle assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app-release.apk
          if-no-files-found: error

  # Le build iOS exige les outils d'Apple (Xcode), qui n'existent que sous macOS.
  # Ce Mac est une machine virtuelle fournie par GitHub (gratuite pour un dépôt
  # public) : aucun ordinateur Apple n'est nécessaire de ton côté.
  ios:
    name: iOS (app-release.ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || V="1.0.0"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Expo prebuild (iOS) + CocoaPods
        run: npx expo prebuild --platform ios --clean

      # Build non signé : aucun compte Apple Developer requis. L'IPA est re-signé
      # à l'installation par AltStore ou SideStore (open source, depuis Windows).
      - name: xcodebuild archive (non signé)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tail -n 200

      - name: Empaqueter l'IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -qry "$GITHUB_WORKSPACE/app-release.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-release.ipa
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: [android, ios]
    # Publie dès que l'APK est prêt, même si le build iOS a échoué.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Manifestation Toolkit ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/app-release.apk
            artifacts/app-release.ipa
          fail_on_unmatched_files: false
          body: |
            ## Téléchargement direct
            - **Android** : `app-release.apk` (autoriser l'installation depuis des sources inconnues).
            - **iOS** : `app-release.ipa` non signé, à installer via AltStore ou SideStore (open source).

            ${{ needs.ios.result != 'success' && '⚠️ Le build iOS a échoué pour cette version : seul l''APK est joint.' || '' }}
